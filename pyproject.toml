[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "animeart"
version = "0.1.0"
description = "From-scratch, geometry-conditioned PyTorch sketch rendering experiments"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
demo = ["gradio>=5,<7"]

[project.scripts]
animeart = "animeart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
